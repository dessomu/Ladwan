<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="8" />
  <!-- Circular ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#blueGrad)" stroke-width="6" opacity="0.5" stroke-dasharray="20 10" />
  <!-- Bicycle icon path (simplified) -->
  <circle cx="175" cy="330" r="52" fill="none" stroke="url(#blueGrad)" stroke-width="18"/>
  <circle cx="337" cy="330" r="52" fill="none" stroke="url(#blueGrad)" stroke-width="18"/>
  <circle cx="175" cy="330" r="10" fill="#3b82f6"/>
  <circle cx="337" cy="330" r="10" fill="#3b82f6"/>
  <!-- Frame -->
  <line x1="175" y1="330" x2="256" y2="220" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="220" x2="337" y2="330" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="220" x2="210" y2="280" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Handlebars -->
  <line x1="256" y1="220" x2="290" y2="205" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round"/>
  <line x1="285" y1="205" x2="300" y2="205" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Seat -->
  <line x1="210" y1="220" x2="250" y2="220" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Speed dot -->
  <circle cx="390" cy="140" r="18" fill="#3b82f6" opacity="0.9"/>
</svg>
