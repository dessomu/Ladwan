<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#44403c" stroke-width="8" />
  <!-- Circular Stone Mill Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />
  <!-- Center Devanagari Glyph "ला" -->
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="220" font-weight="900" text-anchor="middle" fill="url(#goldGrad)">ला</text>
  <!-- Purity Crown Dot -->
  <circle cx="256" cy="115" r="16" fill="#fbbf24" />
</svg>
